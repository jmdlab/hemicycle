[Service]
# Isolation renforcée (audit Fable-5 2026-07-23). Ferme les deux vecteurs réels :
# (1) .env(clé vault)+vault/ lisibles sous ProtectHome=read-only,
# (2) évasion root via /run/docker.sock (user ubuntu ∈ groupe docker).
# ProtectHome=tmpfs overmount /home puis on ré-expose UNIQUEMENT le nécessaire.
ProtectHome=tmpfs
BindPaths=/home/ubuntu/www/denis.me/hemicycle
BindReadOnlyPaths=/home/ubuntu/.venvs/hemicycle
# ~/.claude NON monté : LLM off, le service n'appelle jamais le CLI → on n'expose
# pas le token OAuth à un service public.
InaccessiblePaths=/run/docker.sock
# Filtre d'appels système : garde node + python/cairosvg, coupe le privilégié.
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @obsolete @cpu-emulation
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
