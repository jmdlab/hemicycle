# ── Hémicycle — hemicycle.app ────────────────────────────────────────────────
# Explication publique des scrutins de l'Assemblée nationale. Front statique
# (Vite dist/ à la racine) + API /api/hemicycle/ proxyée vers 127.0.0.1:3206.
# Rate-limit zones hemicycle_* et map $hemicycle_bot déclarées dans nginx.conf.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hemicycle.app www.hemicycle.app;

    ssl_certificate /etc/letsencrypt/live/hemicycle.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hemicycle.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s ipv4=on;
    resolver_timeout 5s;

    include /etc/nginx/snippets/security-headers-preload.conf;

    # www → apex (le certificat couvre les deux).
    if ($host = www.hemicycle.app) { return 301 https://hemicycle.app$request_uri; }

    root /home/ubuntu/www/denis.me/hemicycle/dist;
    index index.html;

    # Crawlers : pages pré-rendues côté serveur. Au scope server, jamais dans un
    # location (if+try_files s'annulent). /<n> = scrutin, /loi/<slug> = texte,
    # /depute/<slug> + /deputes = fiches députés.
    if ($hemicycle_bot) {
        rewrite ^/(\d+)/?$ /api/hemicycle/og/$1 last;
        rewrite ^/loi/([a-z0-9][a-z0-9-]*)/?$ /api/hemicycle/og/loi/$1 last;
        rewrite ^/depute/([a-z0-9][a-z0-9-]*)/?$ /api/hemicycle/og/depute/$1 last;
        rewrite ^/deputes/?$ /api/hemicycle/og/deputes last;
    }

    # Sitemap + image de partage : dans storage/ car vite build vide dist/.
    location = /sitemap.xml {
        alias /home/ubuntu/www/denis.me/hemicycle/storage/sitemap.xml;
        default_type application/xml; expires 1h;
        include /etc/nginx/snippets/security-headers-preload.conf;
    }
    location = /share.png {
        alias /home/ubuntu/www/denis.me/hemicycle/storage/share.png;
        expires 1h;
        include /etc/nginx/snippets/security-headers-preload.conf;
    }

    # Cartes rendues sur disque (images uniquement, ^~ requis).
    location ^~ /storage/cards/ {
        alias /home/ubuntu/www/denis.me/hemicycle/storage/cards/;
        limit_conn hemicycle_conn 20;
        location ~* \.(png|svg|webp)$ {
            try_files $uri =404; expires 30d;
            add_header Cache-Control "public, immutable" always;
            include /etc/nginx/snippets/security-headers-preload.conf;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }
        return 404;
    }
    location ^~ /storage/ { return 404; }

    # API — proxy_pass SANS slash final : le préfixe /api/hemicycle est passé tel quel.
    location ^~ /api/hemicycle/ {
        limit_conn hemicycle_conn 6;
        location = /api/hemicycle/render {
            limit_req zone=hemicycle_render burst=4 nodelay;
            limit_conn hemicycle_conn 2;
            proxy_pass http://127.0.0.1:3206;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            client_max_body_size 64k;
            include /etc/nginx/snippets/security-headers-preload.conf;
            add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }
        # GET /page/:numero rasterise aussi (cairosvg) sur cache-miss — budget
        # dédié plus généreux que /render (lecteur multi-scrutins OK) mais qui
        # empêche le scan des 8434 numéros de forcer 8434 rendus.
        location ~ ^/api/hemicycle/page/\d+$ {
            limit_req zone=hemicycle_page burst=10 nodelay;
            limit_conn hemicycle_conn 3;
            proxy_pass http://127.0.0.1:3206;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 180s;
            client_max_body_size 64k;
            include /etc/nginx/snippets/security-headers-preload.conf;
            add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }

        limit_req zone=hemicycle_read burst=30 nodelay;
        proxy_pass http://127.0.0.1:3206;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        client_max_body_size 64k;
        include /etc/nginx/snippets/security-headers-preload.conf;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # Assets fingerprintés : cache immuable.
    location ~* "/assets/.*\.[0-9a-zA-Z_-]{6,}\.(js|css|woff2|woff)$" {
        include /etc/nginx/snippets/security-headers-preload.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
    }

    # SPA.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers-preload.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hemicycle.app www.hemicycle.app;
    location /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://hemicycle.app$request_uri; }
}
